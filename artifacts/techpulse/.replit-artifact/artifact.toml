kind = "web"
previewPath = "/"
title = "TechPulse"
description = "An AI-powered developer intelligence platform that connects GitHub data with analytics, technology news, trending repositories, and personalized learning guidance."
version = "1.0.0"
id = "artifacts/techpulse"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20199

[services.development]
run = "pnpm --filter @workspace/techpulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/techpulse", "run", "build" ]
serve = "static"
publicDir = "artifacts/techpulse/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20199"
BASE_PATH = "/"
